openapi: 3.2.0
info:
  version: 1.0.0
  title: Coalesce Environments API
  description: REST API for performing operations with the Coalesce backend.
servers:
- url: https://app.coalescesoftware.io
  description: 'Region: us-central1'
- url: https://app.australia-southeast1.gcp.coalescesoftware.io
  description: 'Region: australia-southeast1 (Sydney)'
- url: https://app.northamerica-northeast1.gcp.coalescesoftware.io
  description: 'Region: northamerica-northeast1 (Montreal)'
- url: https://app.eu-west-2.aws.coalescesoftware.io
  description: 'Region: eu-west-2 (London)'
- url: https://app.eu.coalescesoftware.io
  description: 'Region: europe-west-3 (Frankfurt)'
- url: https://app.europe-west1.gcp.coalescesoftware.io
  description: 'Region: europe-west-1 (Belgium)'
- url: https://app.us-east-1.aws.coalescesoftware.io
  description: 'Region: us-east-1 (Virginia)'
- url: https://app.us-east-2.aws.coalescesoftware.io
  description: 'Region: us-east-2 (Ohio)'
- url: https://app.us-west-2.aws.coalescesoftware.io
  description: 'Region: us-west-2 (Oregon)'
- url: https://app.centralus.azure.coalescesoftware.io
  description: 'Region: centralus (Iowa)'
- url: https://app.eastus2.azure.coalescesoftware.io
  description: 'Region: eastus2 (Virginia)'
- url: https://app.westus2.azure.coalescesoftware.io
  description: 'Region: westus2 (Washington)'
- url: https://app.southcentralus.azure.coalescesoftware.io
  description: 'Region: southcentral (San Antonio)'
- url: https://app.us-east4.gcp.coalescesoftware.io
  description: 'Region: us-east4 (Virginia)'
- url: https://app.eu-central-1.aws.coalescesoftware.io
  description: 'Region: eu-central-1 (Frankfurt)'
security:
- BearerAuth: []
tags:
- name: Environments
paths:
  /api/v1/environments:
    summary: Environments
    parameters: []
    get:
      summary: List Environments
      description: Retrieve a list of Environments you can access. Use the optional project query parameter to return only Environments in one Project. When project is set, paging totals and next cursors reflect the filtered set.
      operationId: GetEnvironments
      parameters:
      - name: detail
        description: Include the full detail of the environments.
        in: query
        schema:
          type: boolean
          default: false
        required: false
      - name: project
        description: Filter results to Environments in this Project ID. Omit or pass an empty value to return Environments across all Projects the caller can access.
        in: query
        schema:
          type: string
        required: false
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/startingFrom'
      - $ref: '#/components/parameters/orderBy'
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentsResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      tags:
      - Environments
    post:
      summary: Create Environment
      description: Create a new Environment in a Project. Include project, name, and oauthEnabled in the request body, plus platform connection settings for Snowflake or Databricks. This operation configures connection settings only. Add warehouse passwords or OAuth refresh tokens in the Coalesce App under Build Settings > Environments > User Credentials after creation.
      operationId: CreateEnvironment
      security:
      - BearerAuth: []
      tags:
      - Environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/EnvironmentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
  /api/v1/environments/{environmentID}:
    summary: Environment
    parameters:
    - name: environmentID
      description: The environment ID.
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Get Environment
      description: Retrieve details for a specific Environment by ID.
      operationId: GetEnvironment
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      tags:
      - Environments
    patch:
      summary: Update Environment
      description: Partially update an Environment by ID. Omitted fields are unchanged; null clears nullable fields. This operation configures connection metadata only. Add warehouse passwords or OAuth refresh tokens in the Coalesce App under Build Settings > Environments > User Credentials.
      operationId: UpdateEnvironment
      security:
      - BearerAuth: []
      tags:
      - Environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentPatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/EnvironmentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
    delete:
      summary: Delete Environment
      description: Delete an Environment by ID. This operation is destructive. Ensure the Environment has no active runs or dependent Job Schedules before you delete it. The caller needs permission to delete the target Environment.
      operationId: DeleteEnvironment
      security:
      - BearerAuth: []
      tags:
      - Environments
      responses:
        '204':
          description: The Environment was successfully deleted.
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
  /api/v1/environments/{environmentID}/nodes/{nodeID}:
    summary: Node
    parameters:
    - name: environmentID
      description: The environment ID.
      in: path
      schema:
        type: string
      required: true
    - name: nodeID
      description: The node ID.
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Get Environment Node
      description: Retrieve details for a specific Node by ID.
      operationId: GetNode
      parameters:
      - name: detail
        description: Include the full detail of the node.
        in: query
        schema:
          type: boolean
          default: false
        required: false
      - name: skipParsing
        description: Set to `true` to skip parsing Node transforms for a faster response. Use `skipParsing=true` on its own or together with `detail=true`. Both combinations are supported. With `detail=true`, responses include full node detail but omit parsed transform data.
        in: query
        schema:
          type: boolean
          default: false
        required: false
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/NodeResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      tags:
      - Environments
components:
  parameters:
    orderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        default: id
        example: id
      description: The field to order the results by. Only `id` allowed.
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 500
      description: The maximum number of items to return. Between 1 and 500.
    startingFrom:
      name: startingFrom
      in: query
      required: false
      schema:
        type: string
      description: A cursor that tells the API where to begin returning results. Use it to continue pagination from a specific point in the dataset. This value must come from the `next` field in the previous response. If you define a query cursor using `startingFrom`, you must also include the `orderBy` parameter.
      allowReserved: true
  schemas:
    SQLNode:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseNode'
      additionalProperties: true
      properties:
        config:
          $ref: '#/components/schemas/UserConfig'
        isMultisource:
          type: boolean
        materializationType:
          $ref: '#/components/schemas/MaterializationType'
        metadata:
          $ref: '#/components/schemas/SQLNodeMetadata'
        overrideSQL:
          type: boolean
      required:
      - config
      - description
      - isMultisource
      - locationName
      - materializationType
      - metadata
      - name
      - nodeType
      - overrideSQL
    MaterializationType:
      type: string
      enum:
      - table
      - view
    TestRunOrder:
      type: string
      enum:
      - After
      - Before
    UserSummary:
      type: object
      description: ''
      additionalProperties: false
      required:
      - id
      properties:
        id:
          type: string
          description: The user ID.
          example: BGx8EQ1NlLXxMFwFfV5brGgLj813
        firstName:
          type: string
          description: User first name.
          example: Coalesce
        lastName:
          type: string
          description: User last name.
          example: Support
    SourceMap:
      additionalProperties: false
      properties:
        aliases:
          $ref: '#/components/schemas/AliasToStepIDMapping'
        customSQL:
          $ref: '#/components/schemas/CustomSQL'
        dependencies:
          items:
            $ref: '#/components/schemas/RefLink'
          type: array
        join:
          $ref: '#/components/schemas/JoinCondition'
        name:
          type: string
        noLinkRefs:
          items:
            $ref: '#/components/schemas/RefLink'
          type: array
      required:
      - dependencies
      - join
      - name
      - noLinkRefs
      type: object
    Environment:
      description: Environments are used for deploying your data pipelines to production, test, QA, and other environments.
      allOf:
      - $ref: '#/components/schemas/BaseWorkspaceEnv'
      - type: object
        properties:
          runTimeParameters:
            type: object
            description: Parameters changed during deploy will not show here.
          currentMappings:
            $ref: '#/components/schemas/EnvironmentStorageLocationMappings'
      - type: object
        x-stoplight:
          id: b58je7yplahtr
      x-examples: {}
      title: ''
    SourceColumnReference:
      anyOf:
      - $ref: '#/components/schemas/SourceColumnReferenceV1'
      - $ref: '#/components/schemas/SourceColumnReferenceV2'
    EnvironmentsResponse:
      type: object
      required:
      - data
      properties:
        data:
          description: A collection of environment information.
          anyOf:
          - type: array
            title: Environment response with details
            items:
              $ref: '#/components/schemas/Environment'
          - type: array
            title: Environment response summary
            items:
              $ref: '#/components/schemas/EnvironmentSummary'
        total:
          type: integer
          description: Number of records returned.
        startingFrom:
          type: string
          description: A cursor that tells the API where to begin returning results. Use it to continue pagination from a specific point in the dataset. This value must come from the `next` field in the previous response. If you define a query cursor using `startingFrom`, you must also include the `orderBy` parameter.
        limit:
          type: integer
          description: Limit of the records returned. Some endpoints have `limit` as a query parameter. Default is 100.
        next:
          type:
          - number
          - 'null'
          description: The field value representing the start of the next page of results.
    AppliedColumnTests:
      type: object
      description: Will return `hasNull` or `isDistinct` as true or false if testing is enabled.
      additionalProperties:
        type: boolean
    HashAlgorithm:
      type: string
      enum:
      - MD5
      - SHA1
      - SHA256
    BaseNode:
      type: object
      required:
      - description
      - id
      - locationName
      - name
      - nodeType
      properties:
        database:
          type: string
          description: The Node database name
        description:
          type: string
          description: The Node description.
        id:
          type: string
          description: The Node ID.
        locationName:
          type: string
          description: The Storage Mapping location.
        name:
          type: string
          description: The Node name.
        nodeType:
          $ref: '#/components/schemas/NodeType'
        schema:
          type: string
          description: The Node schema name.
    BaseWorkspaceEnv:
      type: object
      description: A workspace is a collection of resources that are used to develop, test, and deploy code.
      additionalProperties: true
      properties:
        connectionAccount:
          type: string
          description: Snowflake only. The Snowflake account identifier for this environment (for example `xy12345.us-east-1`). Omit for Databricks projects.
        accessUrl:
          type:
          - string
          - 'null'
          description: Databricks only. The workspace URL for this environment (for example `https://adb-1234567890123456.7.azuredatabricks.net`). Omit for Snowflake projects.
        defaultStorageMapping:
          type: string
          nullable: true
        description:
          type: string
          description: The Workspace description.
        name:
          type: string
          description: The Workspace name.
        oauthEnabled:
          type: boolean
          description: If OAuth is enabled.
        tagColors:
          $ref: '#/components/schemas/TagColor'
        project:
          type: string
          description: The Project ID.
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        updatedAt:
          type: string
          format: date-time
        currentGitBranch:
          type: string
          description: The branch most recently run on this environment.
        currentGitCommit:
          type: string
        currentGitURL:
          type: string
        currentlyRunningJobs:
          description: An array of any running Jobs. If there are not Jobs running, this will return empty.
          type: array
          items:
            type: integer
        id:
          type: string
        deployedCommit:
          type: string
          description: The most recently deployed commit ID.
        status:
          $ref: '#/components/schemas/WorkspaceEnvHealth'
      required:
      - createdAt
      - updatedAt
      - id
      - name
      - oauthEnabled
      - project
      - status
    IntermediateColumnRefResult:
      additionalProperties: false
      properties:
        columnName:
          type: string
        tableName:
          type: string
          nullable: true
      required:
      - columnName
      - tableName
      type: object
    UserConfig:
      type: object
      additionalProperties:
        anyOf:
        - type: object
        - type: string
        - type: number
        - type: boolean
    SQLNodeMetadata:
      type: object
      additionalProperties: false
      properties:
        appliedNodeTests:
          default: []
          items:
            $ref: '#/components/schemas/NodeTest'
          type: array
        columns:
          default: []
          items:
            $ref: '#/components/schemas/ColumnMetadata'
          type: array
        cteString:
          type: string
        description:
          type: string
        destinationName:
          type: string
        enabledColumnTestIDs:
          type: array
          items:
            type: string
        mapping:
          type: object
          additionalProperties:
            anyOf:
            - type: object
            - type: string
            - type: number
            - type: boolean
        materializationOption:
          type: string
        sourceMapping:
          type: array
          items:
            $ref: '#/components/schemas/SourceMap'
      required:
      - appliedNodeTests
      - columns
      - enabledColumnTestIDs
      - sourceMapping
    Node:
      type: object
      oneOf:
      - $ref: '#/components/schemas/SourceNode'
      - $ref: '#/components/schemas/SQLNode'
    EnvironmentStorageLocationMappings:
      type: object
      description: The Storage Mapping name.
      additionalProperties:
        type: object
        properties:
          database:
            type: string
            description: The database name.
          schema:
            type: string
            description: The database schema.
    HashMetadata:
      type: object
      additionalProperties: false
      properties:
        hashAlgorithm:
          $ref: '#/components/schemas/HashAlgorithm'
        hashType:
          enum:
          - ChangeHash
          - Hash
          - HubHash
          - LinkHash
          - None
          type: string
        hubHashes:
          items:
            $ref: '#/components/schemas/ColumnReference'
          type: array
      required:
      - hashAlgorithm
    NodeTest:
      type: object
      additionalProperties: false
      properties:
        continueOnFailure:
          type: boolean
        description:
          type: string
        name:
          type: string
        runOrder:
          $ref: '#/components/schemas/TestRunOrder'
        templateString:
          type: string
      required:
      - continueOnFailure
      - description
      - name
      - runOrder
      - templateString
    JoinCondition:
      type: object
      additionalProperties: false
      properties:
        joinCondition:
          type: string
      required:
      - joinCondition
    NodeType:
      anyOf:
      - enum:
        - Dimension
        - Fact
        - Hub
        - Link
        - Satellite
        - Source
        - Stage
        - View
        - persistentStage
        description: Out of the box Node Types.
      - description: Custom or Package Node ID.
        example: externalDataPackage:::372
      description: Either an out of the box Node or a custom Node Type ID or Package Node Type ID
      type: string
    CustomSQL:
      type: object
      additionalProperties: false
      properties:
        customSQL:
          type: string
      required:
      - customSQL
    SourceColumnReferenceV2:
      type: object
      additionalProperties: false
      properties:
        transform:
          type: string
          description: Returns the SQL of any column transformations.
      required:
      - transform
    SourceColumnMetadata:
      type: object
      additionalProperties: false
      properties:
        columns:
          items:
            $ref: '#/components/schemas/ColumnMetadata'
          type: array
        join:
          type: object
          additionalProperties: false
          properties:
            joinCondition:
              type: string
              description: Returns SQL from the Join tab.
          required:
          - joinCondition
        sourceMapping:
          type: array
          items:
            $ref: '#/components/schemas/SourceMap'
      required:
      - columns
    Error:
      type: object
      additionalProperties: false
      properties:
        errorString:
          description: The error message.
          type: string
        errorDetail:
          description: Additional detail about the error.
          type: string
      required:
      - errorString
    BaseEnvironment:
      type: object
      description: Environments are used for deploying your data pipelines to production, test, QA, and other environments.
      additionalProperties: true
      properties:
        connectionAccount:
          type: string
          description: Snowflake only. The Snowflake account identifier for this environment (for example `xy12345.us-east-1`). Omit for Databricks projects.
        accessUrl:
          type:
          - string
          - 'null'
          description: Databricks only. The workspace URL for this environment (for example `https://adb-1234567890123456.7.azuredatabricks.net`). Omit for Snowflake projects.
        defaultStorageMapping:
          type: string
          nullable: true
        description:
          type: string
          description: The Environment description.
        name:
          type: string
          description: The Environment name.
        oauthEnabled:
          type: boolean
          description: If OAuth is enabled.
        runTimeParameters:
          type: object
          additionalProperties: true
          description: The default Environment parameters. Parameters changed during deploy will not show here.
        tagColors:
          $ref: '#/components/schemas/TagColor'
        project:
          type: string
      required:
      - name
      - oauthEnabled
      - project
    EnvironmentSummary:
      type: object
      additionalProperties: false
      required:
      - createdAt
      - id
      - name
      - project
      - status
      properties:
        createdAt:
          type: string
          format: date-time
          description: The time in ISO 8601.
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        id:
          type: string
          description: The Environment ID.
          example: boC3UgRYtaMjxEqv2bxPugrNCJx1
        name:
          type: string
          description: Name of the Environment.
          example: Coalesce
        project:
          type: string
          description: The Project ID.
          example: 7e854ee0-4b7f-46ae-b79c-ace867941f11
        status:
          $ref: '#/components/schemas/EnvironmentHealth'
    ColumnReference:
      type: object
      additionalProperties: false
      properties:
        columnID:
          type: string
          description: Column ID of the source column.
        nodeID:
          type: string
          description: Node ID of the source columm.
      required:
      - columnID
      - nodeID
    EnvironmentPatchRequest:
      type: object
      description: 'Partial update for an existing Environment. Omitted fields are unchanged. Set a field to null to clear nullable values such as accessUrl. Writable fields: name, description, connectionAccount, accessUrl, oauthEnabled, defaultStorageMapping, runTimeParameters, tagColors, mappings. Do not pass warehouse passwords or OAuth refresh tokens. Add credentials in the Coalesce app under Build Settings > Environments > User Credentials.'
      additionalProperties: false
      properties:
        name:
          type: string
          description: The Environment name.
        description:
          type: string
          description: The Environment description.
        connectionAccount:
          type: string
          description: Snowflake only. The Snowflake account identifier for this environment.
        accessUrl:
          type:
          - string
          - 'null'
          description: Databricks only. The workspace URL for this environment. Pass null to clear.
        oauthEnabled:
          type: boolean
          description: If OAuth is enabled.
        defaultStorageMapping:
          type: string
          nullable: true
        runTimeParameters:
          type: object
          additionalProperties: true
          description: The default Environment parameters. Parameters changed during deploy will not show here.
        tagColors:
          $ref: '#/components/schemas/TagColor'
        mappings:
          description: Optional storage location mappings. Storage mappings are normally established or updated when you deploy from a Workspace. Setting mappings only through this API may not match behavior you get from deploy.
          $ref: '#/components/schemas/EnvironmentStorageLocationMappings'
    RefLink:
      type: object
      additionalProperties: false
      properties:
        locationName:
          type: string
        nodeName:
          type: string
      required:
      - locationName
      - nodeName
    AliasToStepIDMapping:
      type: object
      additionalProperties:
        type: string
    TagColor:
      type: object
      description: The tag color from the Environment settings.
      additionalProperties: false
      properties:
        backgroundColor:
          type: string
        textColor:
          type: string
    SourceColumnReferenceV1:
      type: object
      additionalProperties: false
      properties:
        columnReferences:
          items:
            $ref: '#/components/schemas/ColumnReference'
          type: array
        transform:
          type: string
          description: Returns the SQL of any column transformations.
      required:
      - columnReferences
      - transform
    ColumnMetadata:
      type: object
      additionalProperties: false
      properties:
        appliedColumnTests:
          $ref: '#/components/schemas/AppliedColumnTests'
        columnID:
          type: string
          description: The column ID.
        columnReferences:
          items:
            $ref: '#/components/schemas/IntermediateColumnRefResult'
          type: array
        config:
          type: object
          description: Returns any configuration options from the Node Config Tab.
          additionalProperties: true
        dataType:
          type: string
          description: Column data type.
        defaultValue:
          type: string
          description: The default column value.
        description:
          type: string
          description: The column description.
        hashDetails:
          $ref: '#/components/schemas/HashMetadata'
        hashedColumns:
          type: array
