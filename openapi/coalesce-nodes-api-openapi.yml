openapi: 3.2.0
info:
  version: 1.0.0
  title: Coalesce Nodes API
  description: REST API for performing operations with the Coalesce backend.
servers:
- url: https://app.coalescesoftware.io
  description: 'Region: us-central1'
- url: https://app.australia-southeast1.gcp.coalescesoftware.io
  description: 'Region: australia-southeast1 (Sydney)'
- url: https://app.northamerica-northeast1.gcp.coalescesoftware.io
  description: 'Region: northamerica-northeast1 (Montreal)'
- url: https://app.eu-west-2.aws.coalescesoftware.io
  description: 'Region: eu-west-2 (London)'
- url: https://app.eu.coalescesoftware.io
  description: 'Region: europe-west-3 (Frankfurt)'
- url: https://app.europe-west1.gcp.coalescesoftware.io
  description: 'Region: europe-west-1 (Belgium)'
- url: https://app.us-east-1.aws.coalescesoftware.io
  description: 'Region: us-east-1 (Virginia)'
- url: https://app.us-east-2.aws.coalescesoftware.io
  description: 'Region: us-east-2 (Ohio)'
- url: https://app.us-west-2.aws.coalescesoftware.io
  description: 'Region: us-west-2 (Oregon)'
- url: https://app.centralus.azure.coalescesoftware.io
  description: 'Region: centralus (Iowa)'
- url: https://app.eastus2.azure.coalescesoftware.io
  description: 'Region: eastus2 (Virginia)'
- url: https://app.westus2.azure.coalescesoftware.io
  description: 'Region: westus2 (Washington)'
- url: https://app.southcentralus.azure.coalescesoftware.io
  description: 'Region: southcentral (San Antonio)'
- url: https://app.us-east4.gcp.coalescesoftware.io
  description: 'Region: us-east4 (Virginia)'
- url: https://app.eu-central-1.aws.coalescesoftware.io
  description: 'Region: eu-central-1 (Frankfurt)'
security:
- BearerAuth: []
tags:
- name: Nodes
paths:
  /api/v1/environments/{environmentID}/nodes:
    summary: Nodes
    parameters:
    - name: environmentID
      description: The environment ID.
      in: path
      schema:
        type: string
      required: true
    get:
      summary: List Environment Nodes
      description: Retrieve a list of all available Environment Nodes.
      operationId: GetNodes
      parameters:
      - name: detail
        description: Include the full detail of the nodes.
        in: query
        schema:
          type: boolean
          default: false
        required: false
      - name: skipParsing
        description: Set to `true` to skip parsing Node transforms for a faster response. Use `skipParsing=true` on its own or together with `detail=true`. Both combinations are supported. With `detail=true`, responses include full node detail but omit parsed transform data.
        in: query
        schema:
          type: boolean
          default: false
        required: false
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/startingFrom'
      - $ref: '#/components/parameters/orderBy'
      security:
      - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/NodesResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      tags:
      - Nodes
  /api/v1/workspaces/{workspaceID}/nodes:
    summary: Nodes
    parameters:
    - name: workspaceID
      description: The workspace ID.
      in: path
      schema:
        type: string
      required: true
    get:
      summary: List Workspace Nodes
      description: Retrieve a list of all available Workspace Nodes.
      operationId: GetWorkspaceNodes
      parameters:
      - name: detail
        description: Include the full detail of the nodes.
        in: query
        schema:
          type: boolean
          default: false
        required: false
      - name: skipParsing
        description: Set to `true` to skip parsing Node transforms for a faster response. Use `skipParsing=true` on its own or together with `detail=true`. Both combinations are supported. With `detail=true`, responses include full node detail but omit parsed transform data.
        in: query
        schema:
          type: boolean
          default: false
        required: false
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/startingFrom'
      - $ref: '#/components/parameters/orderBy'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    description: A collection of nodes for an environment.
                    anyOf:
                    - type: array
                      title: Node summary response
                      items:
                        type: object
                        required:
                        - database
                        - id
                        - locationName
                        - name
                        - nodeType
                        - schema
                        properties:
                          database:
                            type: string
                            description: The database and schema fields in the response will reflect the values mapped to the storage location for the node in your workspace. If the storage mappings are not configured or are invalid, these fields will be returned as empty strings.
                          id:
                            type: string
                            description: The Coalesce Node ID.
                          locationName:
                            type: string
                            description: The Storage Mapping location.
                          name:
                            type: string
                            description: The Node name.
                          nodeType:
                            $ref: '#/components/schemas/NodeType'
                          schema:
                            type: string
                            description: The database and schema fields in the response will reflect the values mapped to the storage location for the node in your workspace. If the storage mappings are not configured or are invalid, these fields will be returned as empty strings.
                    - type: array
                      title: Node response
                      items:
                        type: object
                        oneOf:
                        - type: object
                          title: Source Node
                          additionalProperties: true
                          required:
                          - database
                          - description
                          - locationName
                          - metadata
                          - name
                          - nodeType
                          - schema
                          - table
                          properties:
                            metadata:
                              $ref: '#/components/schemas/SourceColumnMetadata'
                            table:
                              type: string
                            database:
                              type: string
                              description: The database and schema fields in the response will reflect the values mapped to the storage location for the node in your workspace. If the storage mappings are not configured or are invalid, these fields will be returned as empty strings.
                            description:
                              type: string
                              description: The Node description.
                            id:
                              type: string
                              description: The Node ID.
                            locationName:
                              type: string
                              description: The Storage Mapping location.
                            name:
                              type: string
                              description: The Node name.
                            nodeType:
                              $ref: '#/components/schemas/NodeType'
                            schema:
                              type: string
                              description: The database and schema fields in the response will reflect the values mapped to the storage location for the node in your workspace. If the storage mappings are not configured or are invalid, these fields will be returned as empty strings.
                        - type: object
                          title: SQL Node
                          additionalProperties: true
                          required:
                          - config
                          - database
                          - description
                          - isMultisource
                          - locationName
                          - materializationType
                          - metadata
                          - name
                          - nodeType
                          - overrideSQL
                          - schema
                          properties:
                            config:
                              $ref: '#/components/schemas/UserConfig'
                            isMultisource:
                              type: boolean
                            materializationType:
                              $ref: '#/components/schemas/MaterializationType'
                            metadata:
                              $ref: '#/components/schemas/SQLNodeMetadata'
                            overrideSQL:
                              type: boolean
                            database:
                              type: string
                              description: The database and schema fields in the response will reflect the values mapped to the storage location for the node in your workspace. If the storage mappings are not configured or are invalid, these fields will be returned as empty strings.
                            description:
                              type: string
                              description: The Node description.
                            id:
                              type: string
                              description: The Node ID.
                            locationName:
                              type: string
                              description: The Storage Mapping location.
                            name:
                              type: string
                              description: The Node name.
                            nodeType:
                              $ref: '#/components/schemas/NodeType'
                            schema:
                              type: string
                              description: The database and schema fields in the response will reflect the values mapped to the storage location for the node in your workspace. If the storage mappings are not configured or are invalid, these fields will be returned as empty strings.
                  total:
                    type: integer
                    description: Number of records returned.
                  startingFrom:
                    type: string
                    description: A cursor that tells the API where to begin returning results. Use it to continue pagination from a specific point in the dataset. This value must come from the `next` field in the previous response. If you define a query cursor using `startingFrom`, you must also include the `orderBy` parameter.
                  limit:
                    type: integer
                    description: Limit of the records returned. Some endpoints have `limit` as a query parameter. Default is 100.
                  next:
                    type: string
                    nullable: true
                    description: The field value representing the start of the next page of results.
                  orderBy:
                    type: string
                    description: The field to order the results by. Only `id` allowed.
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      tags:
      - Nodes
    post:
      operationId: CreateNode
      summary: Create Workspace Node
      description: 'Create a new Workspace Node with the specified configuration.


        To update or change the Node data use the Set Node endpoint.


        ## Get the Node Type


        You can get the `nodeType` in two ways:


        - Look up the `nodeType` in the Coalesce App. Go to **Build Settings > Node Types**, then click **View**. At the top you''ll see the `nodeTypeID`. This is your `nodeType`. If the is this: `nodeTypeID: externalDataPackage:::372`, you''ll use: `nodeType: externalDataPackage:::372`.


        - You can use the List Environment Nodes or List Workspace Nodes to get a list of existing Nodes. This endpoint only returns in use Nodes and Node types. For example, if you have Node type ML Forecast and ML Anomaly Detection installed, but you are only using ML Forecast, ML Anomaly Node type won''t return in the API results.


        ## Using `predecessorNodeIDs`


        You can leave it blank, enter a single Node ID or multiple Node IDs.


        **Blank**:


        **Single Node**


        **Multiple Nodes**

        `Region` and `DT_WRK_PART` Node IDs were used.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/NodeResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      tags:
      - Nodes
      security:
      - BearerAuth: []
  /api/v1/workspaces/{workspaceID}/nodes/{nodeID}:
    summary: Node
    parameters:
    - name: workspaceID
      description: The Workspace ID.
      in: path
      schema:
        type: string
      required: true
    - name: nodeID
      description: The Node ID.
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Get Workspace Node
      description: Retrieve details for a specific Workspace Node by ID.
      operationId: GetWorkspaceNode
      parameters:
      - name: detail
        description: Include the full detail of the node.
        in: query
        schema:
          type: boolean
          default: false
        required: false
      - name: skipParsing
        description: Set to `true` to skip parsing Node transforms for a faster response. Use `skipParsing=true` on its own or together with `detail=true`. Both combinations are supported. With `detail=true`, responses include full node detail but omit parsed transform data.
        in: query
        schema:
          type: boolean
          default: false
        required: false
      security:
      - BearerAuth: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                oneOf:
                - type: object
                  title: Source Node
                  additionalProperties: true
                  required:
                  - database
                  - description
                  - locationName
                  - metadata
                  - name
                  - nodeType
                  - schema
                  - table
                  properties:
                    metadata:
                      $ref: '#/components/schemas/SourceColumnMetadata'
                    table:
                      type: string
                    database:
                      type: string
                      description: The database and schema fields in the response will reflect the values mapped to the storage location for the node in your workspace. If the storage mappings are not configured or are invalid, these fields will be returned as empty strings.
                    description:
                      type: string
                      description: The Node description.
                    id:
                      type: string
                      description: The Node ID.
                    locationName:
                      type: string
                      description: The Storage Mapping location.
                    name:
                      type: string
                      description: The Node name.
                    nodeType:
                      $ref: '#/components/schemas/NodeType'
                    schema:
                      type: string
                      description: The database and schema fields in the response will reflect the values mapped to the storage location for the node in your workspace. If the storage mappings are not configured or are invalid, these fields will be returned as empty strings.
                - type: object
                  title: SQL Node
                  additionalProperties: true
                  required:
                  - config
                  - database
                  - description
                  - isMultisource
                  - locationName
                  - materializationType
                  - metadata
                  - name
                  - nodeType
                  - overrideSQL
                  - schema
                  properties:
                    config:
                      $ref: '#/components/schemas/UserConfig'
                    isMultisource:
                      type: boolean
                    materializationType:
                      $ref: '#/components/schemas/MaterializationType'
                    metadata:
                      $ref: '#/components/schemas/SQLNodeMetadata'
                    overrideSQL:
                      type: boolean
                    database:
                      type: string
                      description: The database and schema fields in the response will reflect the values mapped to the storage location for the node in your workspace. If the storage mappings are not configured or are invalid, these fields will be returned as empty strings.
                    description:
                      type: string
                      description: The Node description.
                    id:
                      type: string
                      description: The Node ID.
                    locationName:
                      type: string
                      description: The Storage Mapping location.
                    name:
                      type: string
                      description: The Node name.
                    nodeType:
                      $ref: '#/components/schemas/NodeType'
                    schema:
                      type: string
                      description: The database and schema fields in the response will reflect the values mapped to the storage location for the node in your workspace. If the storage mappings are not configured or are invalid, these fields will be returned as empty strings.
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      tags:
      - Nodes
    put:
      summary: Set Node
      description: Replace all fields of a Workspace Node.
      operationId: SetWorkspaceNode
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/NodeResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      tags:
      - Nodes
    delete:
      summary: Delete Workspace Node
      description: Delete a Workspace Node.
      operationId: DeleteWorkspaceNode
      security:
      - BearerAuth: []
      tags:
      - Nodes
      responses:
        '204':
          description: The Node was successfully deleted.
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGatewayError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
components:
  schemas:
    NodeCreateRequest:
      title: NodeCreateRequest
      x-stoplight:
        id: 9yshq5r4fwnsv
      x-examples: {}
      type: object
      description: You can either create a Coalesce out of the box Node Type or use the nodeTypeID of a package or custom Node in the nodeType field.
      required:
      - nodeType
      - predecessorNodeIDs
      properties:
        nodeType:
          enum:
          - Dimension
          - Fact
          - Hub
          - Link
          - Satellite
          - Source
          - Stage
          - View
          - persistentStage
          - string
          description: Accepts any of the Coalesce out of the box Node Types, or you can enter a nodeTypeID for custom and package Nodes.
        predecessorNodeIDs:
          type: array
          x-stoplight:
            id: iw859pow0hipx
          description: Enter an array of Node IDs if they should be the predecessor to the newly created Node. Leave array empty if there is no predecessor.
          items:
            x-stoplight:
              id: 0nh687wa83933
            type: string
    SQLNode:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseNode'
      additionalProperties: true
      properties:
        config:
          $ref: '#/components/schemas/UserConfig'
        isMultisource:
          type: boolean
        materializationType:
          $ref: '#/components/schemas/MaterializationType'
        metadata:
          $ref: '#/components/schemas/SQLNodeMetadata'
        overrideSQL:
          type: boolean
      required:
      - config
      - description
      - isMultisource
      - locationName
      - materializationType
      - metadata
      - name
      - nodeType
      - overrideSQL
    MaterializationType:
      type: string
      enum:
      - table
      - view
    TestRunOrder:
      type: string
      enum:
      - After
      - Before
    SourceMap:
      additionalProperties: false
      properties:
        aliases:
          $ref: '#/components/schemas/AliasToStepIDMapping'
        customSQL:
          $ref: '#/components/schemas/CustomSQL'
        dependencies:
          items:
            $ref: '#/components/schemas/RefLink'
          type: array
        join:
          $ref: '#/components/schemas/JoinCondition'
        name:
          type: string
        noLinkRefs:
          items:
            $ref: '#/components/schemas/RefLink'
          type: array
      required:
      - dependencies
      - join
      - name
      - noLinkRefs
      type: object
    NodeSummary:
      type: object
      properties:
        database:
          type: string
          description: The database name.
        id:
          type: string
          description: The Coalesce Node ID.
        locationName:
          type: string
          description: The Storage Mapping location.
        name:
          type: string
          description: The Node name.
        nodeType:
          $ref: '#/components/schemas/NodeType'
        schema:
          type: string
          description: The database schema name.
      required:
      - database
      - id
      - locationName
      - name
      - nodeType
      - schema
    SourceColumnReference:
      anyOf:
      - $ref: '#/components/schemas/SourceColumnReferenceV1'
      - $ref: '#/components/schemas/SourceColumnReferenceV2'
    AppliedColumnTests:
      type: object
      description: Will return `hasNull` or `isDistinct` as true or false if testing is enabled.
      additionalProperties:
        type: boolean
    HashAlgorithm:
      type: string
      enum:
      - MD5
      - SHA1
      - SHA256
    BaseNode:
      type: object
      required:
      - description
      - id
      - locationName
      - name
      - nodeType
      properties:
        database:
          type: string
          description: The Node database name
        description:
          type: string
          description: The Node description.
        id:
          type: string
          description: The Node ID.
        locationName:
          type: string
          description: The Storage Mapping location.
        name:
          type: string
          description: The Node name.
        nodeType:
          $ref: '#/components/schemas/NodeType'
        schema:
          type: string
          description: The Node schema name.
    IntermediateColumnRefResult:
      additionalProperties: false
      properties:
        columnName:
          type: string
        tableName:
          type: string
          nullable: true
      required:
      - columnName
      - tableName
      type: object
    SQLNodeMetadata:
      type: object
      additionalProperties: false
      properties:
        appliedNodeTests:
          default: []
          items:
            $ref: '#/components/schemas/NodeTest'
          type: array
        columns:
          default: []
          items:
            $ref: '#/components/schemas/ColumnMetadata'
          type: array
        cteString:
          type: string
        description:
          type: string
        destinationName:
          type: string
        enabledColumnTestIDs:
          type: array
          items:
            type: string
        mapping:
          type: object
          additionalProperties:
            anyOf:
            - type: object
            - type: string
            - type: number
            - type: boolean
        materializationOption:
          type: string
        sourceMapping:
          type: array
          items:
            $ref: '#/components/schemas/SourceMap'
      required:
      - appliedNodeTests
      - columns
      - enabledColumnTestIDs
      - sourceMapping
    UserConfig:
      type: object
      additionalProperties:
        anyOf:
        - type: object
        - type: string
        - type: number
        - type: boolean
    SetNodeRequest:
      title: SetNodeRequest
      type: object
      oneOf:
      - type: object
        title: Source Node Set Request
        additionalProperties: true
        properties:
          description:
            type: string
            description: The Node description.
          id:
            type: string
            description: The Node ID.
          locationName:
            type: string
            description: The Storage Mapping location.
          name:
            type: string
            description: The Node name.
          nodeType:
            $ref: '#/components/schemas/NodeType'
          metadata:
            $ref: '#/components/schemas/SourceColumnMetadata'
          table:
            type: string
        required:
        - description
        - id
        - locationName
        - metadata
        - name
        - nodeType
        - table
      - type: object
        title: SQL Node Set Request
        additionalProperties: true
        properties:
          description:
            type: string
            description: The Node description.
          id:
            type: string
            description: The Node ID.
          locationName:
            type: string
            description: The Storage Mapping location.
          name:
            type: string
            description: The Node name.
          nodeType:
            $ref: '#/components/schemas/NodeType'
          config:
            $ref: '#/components/schemas/UserConfig'
          isMultisource:
            type: boolean
          materializationType:
            $ref: '#/components/schemas/MaterializationType'
          metadata:
            $ref: '#/components/schemas/SQLNodeMetadata'
          overrideSQL:
            type: boolean
        required:
        - config
        - description
        - id
        - isMultisource
        - locationName
        - materializationType
        - metadata
        - name
        - nodeType
        - overrideSQL
    Node:
      type: object
      oneOf:
      - $ref: '#/components/schemas/SourceNode'
      - $ref: '#/components/schemas/SQLNode'
    HashMetadata:
      type: object
      additionalProperties: false
      properties:
        hashAlgorithm:
          $ref: '#/components/schemas/HashAlgorithm'
        hashType:
          enum:
          - ChangeHash
          - Hash
          - HubHash
          - LinkHash
          - None
          type: string
        hubHashes:
          items:
            $ref: '#/components/schemas/ColumnReference'
          type: array
      required:
      - hashAlgorithm
    NodeTest:
      type: object
      additionalProperties: false
      properties:
        continueOnFailure:
          type: boolean
        description:
          type: string
        name:
          type: string
        runOrder:
          $ref: '#/components/schemas/TestRunOrder'
        templateString:
          type: string
      required:
      - continueOnFailure
      - description
      - name
      - runOrder
      - templateString
    JoinCondition:
      type: object
