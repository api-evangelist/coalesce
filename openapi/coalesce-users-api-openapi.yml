            '53': admin
            '54': admin
            '56': admin
            '67': admin
        - userID: hBaH2n5qnAWqsUvHvsoBbChqsPf1
          organizationRole: member
    ErrorResponse:
      value:
        error:
          errorString: string
          errorDetail: string
  responses:
    AlreadyExistsError:
      description: The requested resource already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Example 1:
              $ref: '#/components/examples/ErrorResponse'
    UserRoleResponseV2:
      description: 'Returns user role information for all users in an org.


        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRoleResponseV2'
          examples:
            Example 1:
              $ref: '#/components/examples/UserRolesResponse'
    ForbiddenError:
      description: The client is not permitted to perform the requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Forbidden Error:
              $ref: '#/components/examples/ErrorResponse'
    NotFoundError:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Not Found Error:
              $ref: '#/components/examples/ErrorResponse'
    GatewayTimeoutError:
      description: The server did not receive a response in time from an upstream system.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Gateway Timeout Error:
              $ref: '#/components/examples/ErrorResponse'
    InvalidRequestError:
      description: The request was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Invalid Request Error:
              $ref: '#/components/examples/ErrorResponse'
    BadGatewayError:
      description: The server received an error from an upstream system.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Bad Gateway Error:
              $ref: '#/components/examples/ErrorResponse'
    SingleUserRoleResponseV2:
      description: A single user's role information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SingleUserRoleResponseV2'
          examples:
            Example 1:
              $ref: '#/components/examples/SingleUsersRole'
    Unauthorized:
      description: User lacks authorization to perform this action.
      content:
        application/json:
          schema:
            type: object
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Unauthorized:
              $ref: '#/components/examples/ErrorResponse'
    AllUsersResult:
      description: The list of users
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
                description: Number of records returned.
              startingFrom:
                type: string
                description: A cursor that tells the API where to begin returning results. Use it to continue pagination from a specific point in the dataset. This value must come from the `next` field in the previous response. If you define a query cursor using `startingFrom`, you must also include the `orderBy` parameter.
              limit:
                type: integer
                description: The requested page size.
              next:
                type:
                - string
                - 'null'
                description: The field value representing the start of the next page of results.
              data:
                type: array
                items:
                  type: object
                  properties:
                    firstName:
                      type: string
                    lastName:
                      type: string
                    email:
                      type: string
                    id:
                      type: string
                    authDisabled:
                      type: boolean
                    deleted:
                      type: boolean
            required:
            - total
            - limit
            - next
            - data
    InternalServerError:
      description: The server encountered an unexpected condition that prevented it from fulfilling the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Internal Server Error:
              $ref: '#/components/examples/ErrorResponse'
    ServiceUnavailableError:
      description: The service is currently unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Service Unavailable Error:
              $ref: '#/components/examples/ErrorResponse'
  schemas:
    SingleUserRoleResponseV2:
      $ref: '#/components/schemas/UserOrgRolesV2'
    UserOrgRolesV2:
      description: The roles assigned to a user.
      type: object
      required:
      - userID
      properties:
        userID:
          type: string
          description: The user ID.
        organizationRole:
          type: string
          description: User's organization role. Excluded when requesting specific environments/projects if the role lacks project permissions.
        projectRoles:
          type: object
          description: 'Returns a dictionary mapping project IDs to user roles.


            **Example:**

            ```

            "45a4f214-8a3e-48c7-8c6b-ff284798de4c": "admin"

            ```


            **Format:** `projectID: userRole`


            **Note:** Only includes projects where the user has a role. Environment-only roles are excluded.'
          additionalProperties:
            type: string
        environmentRoles:
          type: object
          description: 'Returns a dictionary mapping environment IDs to user roles.


            **Example:**

            ```

            "33": "admin"

            ```


            **Format:** `environmentID: userRole`


            **Note:** Only includes environments where the user has a role.'
          additionalProperties:
            type: string
    Error:
      type: object
      additionalProperties: false
      properties:
        errorString:
          description: The error message.
          type: string
        errorDetail:
          description: Additional detail about the error.
          type: string
      required:
      - errorString
    UserRoleResponseV2:
      type: object
      properties:
        userRoles:
          type: array
          items:
            $ref: '#/components/schemas/UserOrgRolesV2'
      required:
      - userRoles
      additionalProperties: false
    ErrorResponse:
      description: Error detail in addition to the HTTP status code and text.
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
