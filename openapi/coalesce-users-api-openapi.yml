          organizationRole: contributor
          projectRoles:
            7e854ee0-4b7f-46ae-b79c-ace867941f11: member
          environmentRoles:
            '34': reader
        - userID: boC3UgRYtaMjxEqv2bxPugrNCJx1
          organizationRole: admin
          projectRoles:
            45a4f214-8a3e-48c7-8c6b-ff284798de4c: admin
            7e854ee0-4b7f-46ae-b79c-ace867941f11: admin
            0d42aaab-895d-446a-9014-f4256b575ce2: admin
            0a57c272-d602-4f5d-af23-8be96aa4aa5d: admin
            77b53b16-baa6-49a0-9d97-a515cae50b28: admin
            76f1cc6f-e1de-4380-8004-1c3b2e5191fd: admin
            02c1274e-05a3-4039-a787-dd25b71950d9: admin
            46b15547-25c3-4890-9b9e-772bbc780d0e: admin
            6e948d90-2ef9-4680-9ed1-0600a3601c84: admin
          environmentRoles:
            '3': admin
            '33': admin
            '34': admin
            '39': admin
